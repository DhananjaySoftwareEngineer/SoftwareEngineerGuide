<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Blog</title>
<style>
  :root { --bg:#ffffff; --fg:#1f2328; --muted:#656d76; --card:#f6f8fa; --border:#d0d7de; --accent:#0969da; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --card:#161b22; --border:#30363d; --accent:#58a6ff; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height:1.6; }
  .wrap { max-width:760px; margin:0 auto; padding:48px 20px; }
  h1 { margin:0 0 4px; font-size:2rem; }
  .tag { color:var(--muted); margin:0 0 32px; }
  ul.posts { list-style:none; padding:0; margin:0; display:grid; gap:14px; }
  .posts a { display:block; padding:16px 18px; background:var(--card); border:1px solid var(--border); border-radius:10px; text-decoration:none; color:inherit; }
  .posts a:hover { border-color:var(--accent); }
  .posts .title { color:var(--accent); font-weight:600; font-size:1.05rem; }
  .posts .desc { color:var(--muted); font-size:.92rem; margin-top:2px; }
  footer { margin-top:40px; color:var(--muted); font-size:.85rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>My Blog</h1>
  <p class="tag">Notes and guides on development.</p>

  <ul class="posts">
    <!-- ADD NEW POSTS BELOW: copy one <li> block, change href, title and description -->
    <li>
      <a href="Git_Commands_Learning_Guide.html">
        <div class="title">Git Commands Every Developer Should Know</div>
        <div class="desc">A learning guide to the essential Git commands.</div>
      </a>
    </li>
  </ul>

  <footer>Add more posts by copying the block above.</footer>
</div>
</body>
</html>
